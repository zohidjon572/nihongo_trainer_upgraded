<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish | Nihongo Trainer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-title {
            font-weight: 700;
            color: #333333;
            margin-bottom: 24px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(118, 75, 162, 0.25);
            border-color: #764ba2;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .register-link {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center login-title">Nihongo Trainer</h3>
    
    {% if form.errors %}
        <div class="alert alert-danger p-2 small text-center" role="alert">
            Foydalanuvchi nomi yoki parol xato kiritildi!
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="id_username" class="form-label text-secondary fw-semibold">Foydalanuvchi nomi</label>
            <input type="text" name="username" class="form-control" id="id_username" placeholder="Username kiriting" required autofocus>
        </div>

        <div class="mb-4">
            <label for="id_password" class="form-label text-secondary fw-semibold">Parol</label>
            <input type="password" name="password" class="form-control" id="id_password" placeholder="Parolni kiriting" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Kirish</button>
    </form>

    <div class="text-center mt-3">
        <small class="text-muted">Hisobingiz yo'qmi? <a href="{% url 'trainer:register' %}" class="register-link">Ro'yxatdan o'ting</a></small>
    </div>
</div>

</body>
</html>
