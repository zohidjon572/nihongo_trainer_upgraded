{% extends 'trainer/base.html' %}

{% block title %}Tizimga kirish | Nihongo Trainer{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-body p-4">
                <h3 class="text-center font-weight-bold mb-4 text-primary">Tizimga kirish</h3>

                {% if form.errors %}
                    <div class="alert alert-danger text-center p-2 small">
                        Foydalanuvchi nomi yoki parol xato!
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold">Foydalanuvchi nomi</label>
                        <input type="text" name="username" class="form-control" id="id_username" placeholder="Username kiriting" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-bold">Parol</label>
                        <input type="password" name="password" class="form-control" id="id_password" placeholder="Parolni kiriting" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Kirish</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Hisobingiz yo'qmi? <a href="{% url 'trainer:register' %}" class="text-decoration-none fw-bold">Ro'yxatdan o'ting</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
